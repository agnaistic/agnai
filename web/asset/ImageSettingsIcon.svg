<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Image Frame -->
  <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />

  <!-- Mountains / Landscape (stopping early to avoid cog) -->
  <circle cx="8.5" cy="8.5" r="1.5" />
  <polyline points="21 15, 16 10, 9 17, 5 13, 3 15.5" />

  <!-- Settings Cog (Shifted left, fully visible) -->
  <g transform="translate(14.5, 2.5) scale(0.55)">
    <!-- Invisible protective circle for visual spacing -->
    <circle cx="6" cy="6" r="5" fill="none" stroke="none" />

    <!-- Cog teeth -->
    <circle cx="6" cy="6" r="2.5" />
    <line x1="6" y1="1" x2="6" y2="3" />
    <line x1="6" y1="9" x2="6" y2="11" />
    <line x1="1" y1="6" x2="3" y2="6" />
    <line x1="9" y1="6" x2="11" y2="6" />
    <line x1="2.5" y1="2.5" x2="3.9" y2="3.9" />
    <line x1="8.1" y1="8.1" x2="9.5" y2="9.5" />
    <line x1="2.5" y1="9.5" x2="3.9" y2="8.1" />
    <line x1="8.1" y1="3.9" x2="9.5" y2="2.5" />

    <!-- Cog inner hole -->
    <circle cx="6" cy="6" r="1" stroke="#fff" fill="#fff" />
    <circle cx="6" cy="6" r="1" stroke="currentColor" fill="none" />
  </g>
</svg>